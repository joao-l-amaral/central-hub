name: Development Check

on:
  push:
    branches-ignore:
      - main

env:
  NX_NO_CLOUD: 'true'

defaults:
  run:
    working-directory: src/frontend

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, unraid, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: [self-hosted, unraid, linux]
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx nx run-many -t test --coverage --passWithNoTests

  e2e:
    name: E2E Tests
    runs-on: [self-hosted, unraid, linux]
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e -- --watch=false

  build-check:
    name: Build
    runs-on: [self-hosted, unraid, linux]
    needs: unit-test
    if: always() && needs.unit-test.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Cleanup
        if: always()
        run: rm -rf node_modules dist
        working-directory: src/frontend