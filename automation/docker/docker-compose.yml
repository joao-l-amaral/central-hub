version: '3.9'

services:
  ingress:
    image: nginx:1.27-alpine
    container_name: ingress
    ports:
      - "8880:80"
    network_mode: host
    depends_on:
      - frontend
      - backend
#      - keycloak
    volumes:
      - ./ingress/ingress.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: central-hub-frontend:3.0.0
    container_name: frontend
    network_mode: host
    volumes:
      - ../../src/frontend/buildfiles/conf/default.conf:/etc/nginx/conf.d/default.conf
      - ../../src/frontend/buildfiles/conf/federation.manifest.json:/opt/amaral-sofware/portal/browser/assets/federation.manifest.json

  backend:
    image: central-hub-backend:3.0.0
    container_name: backend
    network_mode: host
    environment:
      - DB_USER_NAME=${DB_USER_NAME}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD}
      - USER_ID=${USER_ID}
      - DATABASE_URL=${DATABASE_URL}
      - NTFY_URL=${NTFY_URL}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_USER=${NTFY_USER}
      - NTFY_PASSWORD=${NTFY_PASSWORD}
      - JAVA_TOOL_OPTIONS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

