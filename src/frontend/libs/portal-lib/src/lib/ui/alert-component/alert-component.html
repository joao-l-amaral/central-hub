@if(visible()) {
    <div class="alert" [class]="status()" [class.alert_small]="subtitle().length === 0">
        <i class="alert__icon" [class]="icon()"></i>
        <div class="alert__body">
            <span class="alert__title">{{ title() }}</span>
            @if(subtitle()) {
                <div class="has-subtitle alert__subtitle">
                    {{ subtitle() }}
                </div>
            }
        </div>
        @if(dismissible()) {
            <button
                chButton
                type="button"
                [variant]="'tertiary'"
                class="alert__dismiss bi bi-x"
                (click)="onClose()"
            >
            </button>
        }
    </div>
}
