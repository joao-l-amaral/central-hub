<div class="table-responsive">
  @if(search()) {
    <lib-search-input
      [onKeySearch]="true"
      [smallOptions]="true"
      (searchValue)="onSearch($event)"
    ></lib-search-input>
  }
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        @for (col of columns(); track col.key()) {
          <th scope="col">
            <lib-table-dt-header
              [value]="col.header()"
            ></lib-table-dt-header>
          </th>
        }
      </tr>
    </thead>

    <tbody>
      @for (row of rows(); track $index) {
        <tr dataRowSelection [row]="row" [selectedRow]="rowSelected()" (rowClicked)="rowClickedFn($event)" >
          @for (col of columns(); track col.key()) {
            <td>
              @if (col.cellTemplate(); as tpl) {
                <ng-container
                  *ngTemplateOutlet="
                    tpl.template;
                    context: {
                      $implicit: row[col.key()],
                      row: row,
                      value: row[col.key()],
                      key: col.key()
                    }
                  "
                ></ng-container>
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>

<lib-table-dt-paginator
  [dataSource]="dataSource()"
  [pageSize]="[1, 5, 10, 25, 50]"
  [pageSizeSelector]="5"
></lib-table-dt-paginator>
