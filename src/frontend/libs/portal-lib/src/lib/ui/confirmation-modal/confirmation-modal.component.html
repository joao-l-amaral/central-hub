<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
    <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <div class="confirmation-modal__actions">
    <button
      chButton
      type="button"
      [label]="'commons.cancel' | translate"
      [variant]="'secondary'"
      (click)="onNoClick()"
    >
    </button>
    <button
      chButton
      type="button"
      [label]="'commons.ok' | translate"
      [variant]="'primary'"
      [mat-dialog-close]="product()"
    >
    </button>
  </div>
</mat-dialog-actions>
