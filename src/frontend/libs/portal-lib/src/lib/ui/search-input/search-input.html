<div [class.ch-search-input--small]="smallOptions()" class="ch-search-input">
  <span class="ch-search-input__icon">
    <i class="bi bi-search"></i>
  </span>
  <input
    type="search"
    [placeholder]="placeholder()"
    name="search"
    class="ch-search-input__field"
    [attr.disabled]="disabled() || null"
    [formControl]="searchForm"
    [class.ch-search-input__field-error]="errorState()"
    (keydown.enter)="onSearch($event)"
  >
  <ng-content/>
</div>
