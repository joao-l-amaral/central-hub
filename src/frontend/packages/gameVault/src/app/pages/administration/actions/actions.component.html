<h3>{{ 'game.vault.actions' | translate }}</h3>

<button
    mat-flat-button
    (click)="onForceGamesUpdate()"
    [disabled]="isLoading()">

    @if(isLoading()){
        <mat-spinner [diameter]="20" strokeWidth="3"></mat-spinner>
    }
    @else {
        <ng-container>{{ 'game.vault.actions.force.update' | translate }}</ng-container>
    }

</button>
