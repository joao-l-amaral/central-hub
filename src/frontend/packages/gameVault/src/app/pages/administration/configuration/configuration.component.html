<h3>!CatConfig configuration</h3>

<div class="mb-2 catconfig-configuration-actions">
    <div>
        @if(!catConfigConfigurationEdit()) {
            <button
                mat-flat-button
                class="btn btn-primary btn-sm"
                (click)="onChangeEditState()"
            >!Edit</button>
        }
        @else {
            <button
                class="btn btn-primary btn-sm ml-2"
                (click)="onChangeEditState()"
            >!Cancel</button>
            <button
                class="btn btn-primary btn-sm ml-2"
            >!Save</button>
        }
    </div>
</div>

<mat-card>
    <form [formGroup]="form" class="w-100">
        <mat-form-field appearance="fill" subscriptSizing="dynamic" class="w-100">
            <mat-label>Configuration</mat-label>

            <textarea
                matInput
                cdkTextareaAutosize
                cdkAutosizeMinRows="5"
                cdkAutosizeMaxRows="50"
                formControlName="configurationData"
                placeholder="Edit configuration..."
            ></textarea>

            <mat-hint align="start"><b>keyWordsToLookFor:</b> !Key words to look for in the platforms name.</mat-hint>
            <mat-hint align="end"><b>keyWordsToIgnore:</b> !Key works to ignore in the platforms name.</mat-hint>
        </mat-form-field>
    </form>
</mat-card>
