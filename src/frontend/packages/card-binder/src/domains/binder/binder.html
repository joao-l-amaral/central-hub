<div class="container-fluid">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 row-cols-xxl-6">
    @for (n of numbers; track n) {
      <div class="col">
        @defer (on viewport) {
          <cb-pokemon-card
            [cardIndex]="n"
          />
        } @placeholder {
          <div class="card-placeholder"></div>
        }
      </div>
    }
  </div>
</div>
