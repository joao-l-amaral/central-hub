<h3>{{ 'gameq.catconfig.configuration.title' | translate }}</h3>

<div class="mb-2 catconfig-configuration-actions">
    <div>
        @if(!catConfigConfigurationEdit()) {
            <button
                mat-button
                libCustomButton
                [label]="'gameq.catconfig.edit' | translate"
                [type]="'primary'"
                (click)="onChangeEditState()"
            >
            </button>
        }
        @else {
            <button
                mat-button
                libCustomButton
                class="ml-2"
                [label]="'gameq.catconfig.cancel' | translate"
                [type]="'secondary'"
                (click)="onChangeEditState()"
            >
            </button>
            <button
                mat-button
                libCustomButton
                class="ml-2"
                [label]="'gameq.catconfig.save' | translate"
                [type]="'primary'"
                (click)="onSaveConfiguration()"
            >
            </button>
        }
    </div>
</div>

<mat-card>
    <form [formGroup]="form" class="w-100">
        <mat-form-field appearance="fill" subscriptSizing="dynamic" class="w-100">
            <mat-label>{{ 'gameq.catconfig.configuration' | translate }}</mat-label>

            <textarea
                matInput
                cdkTextareaAutosize
                cdkAutosizeMinRows="5"
                cdkAutosizeMaxRows="50"
                formControlName="configurationData"
                placeholder="Edit configuration..."
            ></textarea>

            <mat-hint align="start"><b>keyWordsToLookFor:</b> {{ 'gameq.catconfig.keyWordsToLookFor' | translate }}</mat-hint>
            <mat-hint align="end"><b>keyWordsToIgnore:</b> {{ 'gameq.catconfig.keyWordsToIgnore' | translate }}</mat-hint>
        </mat-form-field>
    </form>
</mat-card>
