<div class="container-flex">
    <div class="row">
        <div class="col-md-12 slide-area">
            <mat-slide-toggle [formControl]="slideForm">{{ 'game.vault.administrator' | translate }}</mat-slide-toggle>
        </div>
        <div class="col-md-12">
            @if(isAdministrator()) {
                <gameq-administration-administration/>
            }
            @else {
                <h1>{{ 'gameq.catalog' | translate }}</h1>
            }
        </div>
    </div>
</div>
