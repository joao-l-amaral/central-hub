<div class="container-flex">
    <div class="row">
        <div class="col-md-12 slide-area">
            <mat-slide-toggle [formControl]="slideForm">{{ 'gameq.administrator' | translate }}</mat-slide-toggle>
        </div>
        <div class="col-md-12">
            @if(isAdministrator()) {
                <gameq-administration-administration/>
            }
            @else {
              <h1>{{ 'gameq.catalog' | translate }}</h1>

               <lib-table-dt
                  [search]="true"
                  [removeRecords]="true"
                  [dataSource]="dataSource"
                  (rowClicked)="rowClicked($event)"
               >
                  <lib-dt-col header="Name" key="name" class="hide-on-small">
                    <ng-template libDtTemplate let-value="value">
                      {{ value }}
                    </ng-template>
                  </lib-dt-col>

                  <lib-dt-col header="Age" key="age" class="hide-on-small">
                    <ng-template libDtTemplate let-value="value">
                      {{ value }}
                    </ng-template>
                  </lib-dt-col>

                  <lib-dt-col header="Role" key="role">
                    <ng-template libDtTemplate let-value="value">
                      {{ value }}
                    </ng-template>
                  </lib-dt-col>

                  <lib-dt-col header="Function" key="function">
                    <ng-template libDtTemplate let-value="value">
                      {{ value }}
                    </ng-template>
                  </lib-dt-col>
               </lib-table-dt>
            }
        </div>
    </div>
</div>
