<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <lib-header
        [text]="'gameq.administrator.title' | translate"
        [icon]="'bi bi-gear'"
      >
        <gameq-actions-administration/>
      </lib-header>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-2 administration-selector">
      <gameq-platform-selector/>
    </div>
    <div class="col-lg-10 administration-configuration">
      @if(catConfigConfigurationEdit) {
        <gameq-administration-edit-card
          [configuration]="configurationsAsString()"
          (changeConfigurationStatus)="onChangeEditState()"
        />
      }
      @else {
        <gameq-configuration-administration
          [configuration]="configurations()"
        >
          <div class="administration-configuration__action">
            <button
              chButton
              type="button"
              [icon]="'bi bi-pencil-fill'"
              [variant]="'primary'"
              (click)="onChangeEditState()"
            >
            </button>
          </div>
        </gameq-configuration-administration>
      }
    </div>
  </div>
</div>
