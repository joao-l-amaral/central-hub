<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
    <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button
        chButton
        type="button"
        [label]="cancelTranslation"
        [variant]="'secondary'"
        (click)="onNoClick()"
    >
    </button>
    <button type="button" mat-flat-button [mat-dialog-close]="product()" cdkFocusInitial>{{ okTranslation }}</button>
</mat-dialog-actions>
