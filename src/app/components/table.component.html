@if (col.cellTemplate(); as tpl) {
              <ng-container
                *ngTemplateOutlet="
                  tpl.template;
                  context: {
                    $implicit: row[col.key()],
                    row: row,
                    value: row[col.key()],
                    key: col.key()
                  }
                "
              ></ng-container>
            }
